name: Release APK

# Trigger: jab bhi ek version tag push ho, jaise v1.0.0
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Java (JDK 17 — required by Expo SDK 54 / RN 0.81)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Android SDK is preinstalled on ubuntu-latest runners, so no
      # separate SDK setup action is needed. Accept licenses just in case.
      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install dependencies (pnpm)
        run: pnpm install --frozen-lockfile

      # Release signing. Agar secrets set hain to release-signed APK banega.
      # Nahi to ek fresh self-signed keystore generate hota hai (installable APK).
      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'voxa_release' }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'voxa_release' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'voxa_release' }}
        run: |
          mkdir -p android/app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          else
            keytool -genkeypair -v \
              -storetype PKCS12 \
              -keystore android/app/release.keystore \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=VOXA, OU=VOXA, O=VOXA, L=City, ST=State, C=IN" \
              -noprompt
          fi
          {
            echo "RELEASE_STORE_FILE=release.keystore"
            echo "RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> android/gradle.properties
        shell: bash

      # The android/ native project (with custom Kotlin/C++ modules) is already
      # committed, so we build it directly without `expo prebuild`
      # (prebuild would regenerate and wipe the custom native code).
      - name: Make gradlew executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "APK_PATH=$APK" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "VOXA v${{ github.ref_name }}"
          body: |
            ## VOXA Android Release — ${{ github.ref_name }}

            **Install:** Download the APK below and allow "Install from unknown sources".

            ### What's inside
            - Voice-first mobile AI execution assistant
            - Incoming call management & caller-name announcer
            - Real-time notification listener & auto-responder
            - System-wide media controller
            - App launcher, hardware & settings control
            - Calendar & on-device memory tools
          draft: false
          prerelease: false
          files: |
            ${{ steps.apk.outputs.APK_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
